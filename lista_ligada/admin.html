<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Flora Atelier — Painel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-gray-800">
    <header class="bg-purple-950 text-white p-4 shadow flex justify-between items-center">
        <h1 class="text-xl font-bold">🛠️ Flora Atelier — Painel Admin</h1>
        <div class="flex items-center gap-2">
            <a href="/"
                class="bg-purple-800 hover:bg-purple-700 text-white text-sm font-semibold px-3.5 py-2 rounded-xl">
                ← Cliente
            </a>
            <button type="button" onclick="concluirPrimeiro()"
                class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-xl">
                ✓ Concluir Primeiro (HEAD)
            </button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto p-6">
        <section class="bg-white p-6 rounded-2xl shadow">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold">Pedidos Recebidos</h2>
                <span id="resumo" class="text-xs font-mono bg-slate-100 px-3 py-1 rounded">HEAD: NULL | Total: 0</span>
            </div>
            <div id="listaAdmin" class="space-y-3"></div>
        </section>
    </main>

    <script>
        let pedidosAtuais = [];

        async function removerPorId(id) {
            const res = await fetch(`/pedidos/${id}`, { method: "DELETE" });
            if (res.ok) {
                carregarPedidos();
            }
        }

        async function concluirPrimeiro() {
            if (!pedidosAtuais.length) return;
            await removerPorId(pedidosAtuais[0].id);
        }

        function renderizar(pedidos = []) {
            pedidosAtuais = pedidos;
            const container = document.getElementById("listaAdmin");
            const resumo = document.getElementById("resumo");
            const headId = pedidos.length ? `#${pedidos[0].id}` : "NULL";
            resumo.textContent = `HEAD: ${headId} | Total: ${pedidos.length}`;

            if (!pedidos.length) {
                container.innerHTML = '<p class="text-sm text-gray-400">Nenhum pedido na fila.</p>';
                return;
            }

            let html = "";
            for (let i = 0; i < pedidos.length; i++) {
                const atual = pedidos[i];
                const proximo = pedidos[i + 1] ? `#${pedidos[i + 1].id}` : "NULL";
                html += `
                    <div class="border rounded-xl p-4 flex justify-between items-center">
                        <div>
                            <p class="font-bold text-purple-950">Pedido #${atual.id} — ${atual.cliente}</p>
                            <p class="text-sm text-gray-700">${atual.quantidade}x ${atual.produto}</p>
                            <p class="text-xs font-mono text-gray-400">próximo → ${proximo}</p>
                        </div>
                        <button type="button" onclick="removerPorId(${atual.id})"
                            class="bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-3 py-2 rounded-lg">
                            Remover
                        </button>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        async function carregarPedidos() {
            try {
                const res = await fetch("/pedidos");
                if (!res.ok) return;
                const pedidos = await res.json();
                renderizar(Array.isArray(pedidos) ? pedidos : []);
            } catch {
                renderizar([]);
            }
        }

        carregarPedidos();
    </script>
</body>
</html>
