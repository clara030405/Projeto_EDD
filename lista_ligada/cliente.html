<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Flora Atelier — Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-purple-50 min-h-screen text-gray-800">
    <header class="bg-purple-800 text-white p-4 shadow flex justify-between items-center">
        <h1 class="text-xl font-bold">🌸 Flora Atelier — Cliente</h1>
        <a href="/admin"
            class="bg-purple-600 hover:bg-purple-500 px-3 py-1.5 rounded-lg text-sm font-medium">
            Abrir Painel Admin ↗
        </a>
    </header>

    <main class="max-w-4xl mx-auto p-6 grid md:grid-cols-2 gap-6">
        <section class="bg-white p-6 rounded-2xl shadow">
            <h2 class="text-lg font-bold text-purple-900 mb-4">Novo Pedido</h2>
            <form id="formPedido" action="/pedidos" method="POST" class="space-y-3">
                <div>
                    <label class="block text-sm font-medium">Nome</label>
                    <input type="text" id="cliente" name="cliente" required placeholder="Ex: Clara"
                        class="w-full border rounded-lg p-2 mt-1">
                </div>
                <div>
                    <label class="block text-sm font-medium">Buquê</label>
                    <select id="produto" name="produto" class="w-full border rounded-lg p-2 mt-1">
                        <option value="Buquê Lavanda Real">Buquê Lavanda Real</option>
                        <option value="Buquê Girassol & Margaridas">Buquê Girassol & Margaridas</option>
                        <option value="Buquê Rosas Lilás">Buquê Rosas Lilás</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium">Quantidade</label>
                    <input type="number" id="quantidade" name="quantidade" value="1" min="1" required
                        class="w-full border rounded-lg p-2 mt-1">
                </div>
                <button type="submit"
                    class="w-full bg-purple-700 hover:bg-purple-800 text-white font-semibold py-2.5 rounded-xl">
                    + Inserir Pedido
                </button>
            </form>
        </section>

        <section class="bg-white p-6 rounded-2xl shadow">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-purple-900">Meus Pedidos</h2>
                <span id="contador" class="text-xs bg-purple-100 text-purple-800 px-2.5 py-1 rounded-full font-semibold">0 nó(s)</span>
            </div>
            <div id="listaCliente" class="space-y-3"></div>
        </section>
    </main>

    <script>
        async function apagarPedido(id) {
            const res = await fetch(`/pedidos/${id}`, { method: "DELETE" });
            if (res.ok) {
                carregarPedidos();
            }
        }

        function renderizar(pedidos = []) {
            const container = document.getElementById("listaCliente");
            const contador = document.getElementById("contador");
            contador.textContent = `${pedidos.length} nó(s)`;

            if (!pedidos.length) {
                container.innerHTML = '<p class="text-sm text-gray-400">Nenhum pedido cadastrado.</p>';
                return;
            }

            let html = "";
            for (let i = 0; i < pedidos.length; i++) {
                const atual = pedidos[i];
                const proximo = pedidos[i + 1] ? `#${pedidos[i + 1].id}` : "NULL";
                html += `
                    <div class="border border-purple-100 rounded-xl p-3 bg-purple-50/40 flex justify-between items-center">
                        <div>
                            <p class="font-bold text-purple-900">Pedido #${atual.id} — ${atual.cliente}</p>
                            <p class="text-sm text-gray-700">${atual.quantidade}x ${atual.produto}</p>
                            <p class="text-xs font-mono text-purple-600">próximo → ${proximo}</p>
                        </div>
                        <button type="button" onclick="apagarPedido(${atual.id})"
                            class="text-xs bg-red-100 hover:bg-red-200 text-red-700 px-2.5 py-1 rounded-lg font-medium">
                            Apagar
                        </button>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        async function carregarPedidos() {
            try {
                const res = await fetch("/pedidos");
                if (!res.ok) return;
                const pedidos = await res.json();
                renderizar(Array.isArray(pedidos) ? pedidos : []);
            } catch {
                renderizar([]);
            }
        }

        carregarPedidos();
    </script>
</body>
</html>
